global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: karenbot
    metrics_path: /metrics
    static_configs:
      - targets:
          - "127.0.0.1:18081"

  - job_name: prometheus
    static_configs:
      - targets:
          - "127.0.0.1:9090"
